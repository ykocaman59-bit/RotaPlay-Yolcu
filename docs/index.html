<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RotaPlay Sarı Taksi</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--ink:#14161a;--panel:#1d2026;--line:#2c3038;--text:#f1f1ee;--mute:#9aa0aa;--cab:#ffc20e;--ok:#46c37b;--bad:#ff6b5e}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#map{position:absolute;inset:0}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));z-index:500;max-width:520px;margin:auto;box-shadow:0 -8px 30px #0008;max-height:88vh;overflow:auto}
h1{font-size:20px;margin:0 0 4px}h2{font-size:17px;margin:18px 0 6px}p{margin:4px 0;color:var(--mute)}
input{width:100%;padding:13px 14px;margin:6px 0;border-radius:12px;border:1px solid var(--line);background:var(--ink);color:var(--text);font:inherit}
input:focus{outline:2px solid var(--cab);border-color:transparent}
button{width:100%;padding:15px;margin-top:10px;border:0;border-radius:14px;background:var(--cab);color:#1a1400;font:700 17px inherit;cursor:pointer}
button.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);font-weight:500}
button.link{background:none;color:var(--cab);border:0;font-weight:500;padding:8px;margin:0;width:auto;font-size:15px}
button:disabled{opacity:.5}button:focus-visible{outline:3px solid #fff}
.row{display:flex;gap:8px}.row input{flex:1}.row button{width:auto;margin:6px 0;padding:0 16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-size:34px;font-weight:800;color:var(--cab)}.plate{display:inline-block;background:var(--cab);color:#1a1400;font-weight:800;padding:2px 10px;border-radius:6px;letter-spacing:1px}
.stars{display:flex;gap:6px;justify-content:center;margin:10px 0}.stars button{width:48px;margin:0;padding:8px;background:var(--ink);color:var(--mute);font-size:24px}.stars button.on{color:var(--cab)}
.err{color:var(--bad);min-height:1.2em}.ok{color:var(--ok)}.hide{display:none!important}

#profBtn{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:600;width:auto;margin:0;padding:10px 16px;border-radius:99px;font-size:15px}

.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}.kv span:first-child{color:var(--mute)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;background:#ffc20e33;color:var(--cab)}.tag.g{background:#46c37b33;color:var(--ok)}.tag.r{background:#ff6b5e33;color:var(--bad)}

.bellw{position:relative;display:inline-block;margin-left:6px}.bn{position:absolute;top:-11px;right:-14px;background:#ff3b30;color:#fff;border-radius:99px;font:700 11px/1 system-ui;padding:3px 6px}

#panel{position:fixed;inset:0;z-index:800;background:#000a;display:flex;align-items:flex-end;justify-content:center}
#panel .box{background:var(--panel);width:100%;max-width:520px;max-height:92vh;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));overflow:auto}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.tabs button{margin:0;padding:10px}.tabs button.on{background:var(--cab);color:#1a1400}.tabs button:not(.on){background:var(--ink);color:var(--mute)}
#msgs{min-height:140px;max-height:42vh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:6px 0}

.b .tm{font-size:11px;opacity:.6;margin-top:2px}

</style></head><body>
<div id="map"></div>
<button id="profBtn" class="hide">Profil</button>
<div class="sheet" id="sheet"></div>
<div class="page hide" id="page"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="config.js"></script>
<script src="places.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, sendPasswordResetEmail, signOut, reload } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, collection, setDoc, getDoc, getDocs, addDoc, updateDoc, onSnapshot, query, where, limit, orderBy, runTransaction, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const GMAIL_ONLY = true;                       // false yaparsan her e-posta adresi kabul edilir
const $ = s => document.querySelector(s), sheet = $('#sheet'), page = $('#page'), profBtn = $('#profBtn');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tl = t => t ? new Date(t).toLocaleString('tr-TR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '-';
const money = n => Number(n).toLocaleString('tr-TR', {minimumFractionDigits:2}) + ' ₺';

// ---------- Harita ----------
// İstanbul ili sınırları (yaklaşık kutu): harita ve arama yalnızca bu alanla sınırlıdır
const IST = {s:40.78, w:27.90, n:41.62, e:30.02};
const inIst = (la, lo) => la >= IST.s && la <= IST.n && lo >= IST.w && lo <= IST.e;
const map = L.map('map', {zoomControl:false, minZoom:9, maxBounds:[[IST.s - 0.15, IST.w - 0.25], [IST.n + 0.15, IST.e + 0.25]], maxBoundsViscosity:0.7}).setView([41.0082, 28.9784], 12);
// Harita altlığı: varsayılan OpenFreeMap (ücretsiz, anahtarsız, ticari kullanıma açık); olmazsa OpenStreetMap.
// config.js'e Yandex Tiles API anahtarı (ücretli) yazılırsa Yandex Harita kullanılır.
const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'});
const loadScript = src => new Promise((ok, err) => { const e = document.createElement('script'); e.src = src; e.onload = ok; e.onerror = () => err(new Error('script ' + src)); document.head.appendChild(e); });
const loadCss = href => { const e = document.createElement('link'); e.rel = 'stylesheet'; e.href = href; document.head.appendChild(e); };
async function addVectorMap() {
  try {
    const c = document.createElement('canvas');
    if (!(c.getContext('webgl2') || c.getContext('webgl'))) throw new Error('WebGL yok');
    loadCss('https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css');
    await loadScript('https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js');
    await loadScript('https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js');
    if (!L.maplibreGL) throw new Error('maplibre-gl-leaflet yüklenemedi');
    L.maplibreGL({style:'https://tiles.openfreemap.org/styles/liberty',
      attribution:'<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> © <a href="https://openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).addTo(map);
  } catch (e) { console.warn('Vektör harita açılamadı, OpenStreetMap kullanılıyor', e); osmLayer.addTo(map); }
}
const YTK = String((window.APP_CONFIG || {}).YANDEX_TILES_KEY || '').trim();
const MAPP = String((window.APP_CONFIG || {}).MAP_PROVIDER || 'openfreemap').toLowerCase();
if (YTK) {
  const yLayer = L.tileLayer(`https://tiles.api-maps.yandex.ru/v1/tiles/?apikey=${encodeURIComponent(YTK)}&lang=tr_TR&x={x}&y={y}&z={z}&l=map&projection=web_mercator`,
    {maxZoom:19, attribution:'<a href="https://yandex.com.tr/maps" target="_blank" rel="noopener">Yandex Harita</a>'}).addTo(map);
  let okT = 0, badT = 0, fell = false;
  yLayer.on('tileload', () => okT++);
  yLayer.on('tileerror', () => { badT++; if (!okT && badT >= 4 && !fell) { fell = true; map.removeLayer(yLayer); addVectorMap(); } });   // anahtar hatalıysa ücretsiz haritaya dön
} else if (MAPP === 'osm') osmLayer.addTo(map);
else addVectorMap();
const icon = c => L.divIcon({className:'', html:`<div style="width:18px;height:18px;border-radius:50%;background:${c};border:3px solid #fff;box-shadow:0 0 6px #000a"></div>`, iconSize:[18,18]});

// ---------- Firebase ----------
let app, auth, db, user = null, profile = null;
let me = null, dest = null, pickMode = false, meM, destM, drvM, unsub, expT, stars = 0, rideId = null, lastSend = 0;
try {
  if (String(window.FIREBASE_CONFIG.apiKey).startsWith('BURAYA')) throw new Error('config.js içine Firebase ayarlarını yazın.');
  app = initializeApp(window.FIREBASE_CONFIG); auth = getAuth(app); auth.languageCode = 'tr'; db = getFirestore(app);
} catch (e) { sheet.innerHTML = `<h1>Bağlanılamadı</h1><p>${esc(e.message)}</p>`; throw e; }

const authMsg = e => ({
  'auth/invalid-credential': 'E-posta veya şifre hatalı.', 'auth/wrong-password': 'E-posta veya şifre hatalı.', 'auth/user-not-found': 'E-posta veya şifre hatalı.',
  'auth/email-already-in-use': 'Bu e-posta zaten kayıtlı. Giriş yapın.', 'auth/weak-password': 'Şifre en az 6 karakter olmalı.',
  'auth/invalid-email': 'Geçersiz e-posta adresi.', 'auth/too-many-requests': 'Çok fazla deneme, biraz bekleyip tekrar deneyin.',
  'auth/network-request-failed': 'İnternet bağlantısı yok.', 'auth/missing-password': 'Şifre girin.'
}[e.code] || ('Hata: ' + (e.code || e.message)));
const log = (name, detail = '') => user && addDoc(collection(db, 'events'), {uid:user.uid, who:'passenger', name, detail:String(detail).slice(0,200), t:Date.now()}).catch(() => {});
const setErr = (m, good) => { const e = $('#err'); if (e) { e.textContent = m; e.className = good ? 'ok' : 'err'; } };

// ---------- Adres arama (Yandex Geocoder anahtarı varsa o, yoksa OpenStreetMap) ----------
const APP = window.APP_CONFIG || {};
const YKEY = (APP.YANDEX_API_KEY || '').trim();
async function geocodeYandex(q, c) {
  const u = `https://geocode-maps.yandex.ru/1.x/?apikey=${encodeURIComponent(YKEY)}&format=json&lang=tr_TR&results=7&bbox=${IST.w},${IST.s}~${IST.e},${IST.n}&rspn=1&geocode=${encodeURIComponent(q)}`;
  const res = await fetch(u); if (!res.ok) throw new Error('yandex ' + res.status);
  const j = await res.json();
  return (j.response.GeoObjectCollection.featureMember || []).map(m => {
    const g = m.GeoObject, [lo, la] = g.Point.pos.split(' ').map(Number);
    return {lat:la, lon:lo, title:g.name, sub:g.description || '', full:(g.metaDataProperty.GeocoderMetaData.text || g.name)};
  });
}
// Türkçe kısaltmaları aç: "atatürk cd. no:12" -> "atatürk caddesi 12"
function normQ(q) {
  return q.toLocaleLowerCase('tr').replace(/[.,;]/g, ' ')
    .replace(/\b(cad|cd)\b/g, 'caddesi').replace(/\b(sok|sk)\b/g, 'sokak').replace(/\b(mah|mh)\b/g, 'mahallesi')
    .replace(/\b(bulv|blv|bul)\b/g, 'bulvarı').replace(/\bno\s*:?\s*(\d)/g, '$1').replace(/\s+/g, ' ').trim();
}
const stripNo = q => q.replace(/\b\d+\s*\/?\s*[a-zA-Z]?\s*$/, '').trim();           // sondaki kapı numarasını at
async function nominatim(q, c) {
  const vb = `${IST.w},${IST.n},${IST.e},${IST.s}`;      // yalnızca İstanbul
  const res = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&countrycodes=tr&accept-language=tr&addressdetails=1&viewbox=${vb}&bounded=1&q=${encodeURIComponent(q)}`);
  if (!res.ok) throw new Error('osm ' + res.status);
  return (await res.json()).map(x => ({lat:+x.lat, lon:+x.lon, title:x.name || x.display_name.split(',')[0], sub:x.display_name, full:x.display_name.split(',').slice(0, 3).join(',')}));
}
async function geocodeOsm(q, c) {
  const n = normQ(q);
  let r = await nominatim(n, c);
  if (!r.length) { const s2 = stripNo(n); if (s2 && s2 !== n) { r = await nominatim(s2, c); r.forEach(x => x.sub = 'Kapı numarası bulunamadı, sokağın konumu. Pini sürükleyip düzeltin. ' + x.sub); } }
  return r;
}
async function geocodePhoton(q, c) {            // ikinci ücretsiz kaynak (OpenStreetMap tabanlı, farklı arama motoru)
  const res = await fetch(`https://photon.komoot.io/api/?limit=8&lat=${c.lat}&lon=${c.lon}&bbox=${IST.w},${IST.s},${IST.e},${IST.n}&q=${encodeURIComponent(normQ(q))}`);
  if (!res.ok) throw new Error('photon ' + res.status);
  const j = await res.json();
  return (j.features || []).filter(f => (!f.properties.countrycode || f.properties.countrycode === 'TR') && inIst(f.geometry.coordinates[1], f.geometry.coordinates[0])).map(f => {
    const p = f.properties, [lo, la] = f.geometry.coordinates;
    const line1 = [p.street || p.name, p.housenumber].filter(Boolean).join(' ');
    const line2 = [p.district, p.city || p.county, p.state].filter(Boolean).join(', ');
    return {lat:la, lon:lo, title:line1 || p.name || q, sub:line2, full:[line1, line2].filter(Boolean).join(', ')};
  });
}
// Yapıştırılan koordinat ya da harita bağlantısından konumu çıkar (Yandex: ll=boylam,enlem · Google: @enlem,boylam)
function parseCoords(q) {
  const num = '(-?\\d{1,3}(?:[.,]\\d+)?)';
  const inTR = (la, lo) => la > 35 && la < 43 && lo > 25 && lo < 45;
  const fix = x => parseFloat(String(x).replace(',', '.'));
  let m;
  if ((m = q.match(new RegExp('[?&](?:ll|pt)=' + num + '(?:%2C|,)' + num)))) { const lo = fix(m[1]), la = fix(m[2]); if (inTR(la, lo)) return {lat:la, lon:lo}; }
  if ((m = q.match(new RegExp('@' + num + ',' + num)))) { const la = fix(m[1]), lo = fix(m[2]); if (inTR(la, lo)) return {lat:la, lon:lo}; }
  if ((m = q.match(new RegExp('!3d' + num + '!4d' + num)))) { const la = fix(m[1]), lo = fix(m[2]); if (inTR(la, lo)) return {lat:la, lon:lo}; }
  if ((m = q.match(new RegExp('^\\s*' + num + '\\s*[,;\\s]\\s*' + num + '\\s*$')))) {
    const a1 = fix(m[1]), a2 = fix(m[2]);
    if (inTR(a1, a2)) return {lat:a1, lon:a2};
    if (inTR(a2, a1)) return {lat:a2, lon:a1};
  }
  return null;
}
// ---------- Yerel liste: 81 il merkezi + İstanbul ilçe/mahalleleri (docs/places.js, YAKLAŞIK konumlar) ----------
const TRN = s => String(s).toLocaleLowerCase('tr').replace(/ı/g, 'i').replace(/ş/g, 's').replace(/ç/g, 'c').replace(/ğ/g, 'g').replace(/ö/g, 'o').replace(/ü/g, 'u').replace(/[^a-z0-9]+/g, ' ').trim();
const STOP = new Set(['mahallesi', 'mahalle', 'mah', 'mh', 'ilcesi', 'ilce', 'ili', 'il', 'istanbul']);
let localIdx = null;
function localIndex() {
  if (localIdx) return localIdx;
  const P = window.PLACES || {}; localIdx = [];
  (P.il || []).forEach(([, n, la, lo]) => localIdx.push({k:TRN(n), n:TRN(n), r:0, lat:la, lon:lo, zoom:12, title:n, sub:'İl merkezi · yaklaşık konum', full:n}));
  (P.ilce || []).forEach(([n, la, lo]) => localIdx.push({k:TRN(n + ' istanbul'), n:TRN(n), r:1, lat:la, lon:lo, zoom:13, title:n + ', İstanbul', sub:'İlçe · yaklaşık konum', full:n + ', İstanbul'}));
  (P.mah || []).forEach(([ic, n, la, lo, q]) => localIdx.push({k:TRN(n + ' mahallesi ' + ic + ' istanbul'), n:TRN(n), r:2, lat:la, lon:lo, zoom:15, q:!!q,
    title:n + ' Mahallesi', sub:ic + ', İstanbul · muhtarlık binası konumu, yaklaşık' + (q ? ' · ⚠ konum doğrulanmadı' : ''), full:n + ' Mahallesi, ' + ic + ', İstanbul'}));
  return localIdx;
}
function localSearch(q) {
  const qn = TRN(q); if (qn.length < 2) return [];
  const tokens = qn.split(' ').filter(t => t && !STOP.has(t));
  const res = [];
  for (const x of localIndex()) {
    let score = 0;
    if (x.r === 0) { if (x.n === qn) score = 100; else if (x.n.startsWith(qn)) score = 40; }    // il: yalnızca ada göre
    else if (tokens.length && tokens.every(t => (' ' + x.k).includes(' ' + t))) score = x.n === tokens.join(' ') ? 90 : (x.n.startsWith(tokens[0]) ? 30 : 10);
    if (score) res.push({...x, score, approx:true, exact:score >= 90});
  }
  return res.filter(x => x.r > 0).sort((a, b) => b.score - a.score || a.r - b.r).slice(0, 6);
}
const kmBetween = (a, b, c, d) => { const p = Math.PI / 180, x = Math.sin((c - a) * p / 2) ** 2 + Math.cos(a * p) * Math.cos(c * p) * Math.sin((d - b) * p / 2) ** 2; return 12742 * Math.asin(Math.sqrt(x)); };
// Uzak (Photon/Nominatim) ve yerel sonuçları birleştir: birebir il/ilçe adı en başa, mahalleler sona; aynı yere düşenler tekrarlanmaz
function mergeResults(remote, local) {
  const out = [];
  for (const x of remote) if (!out.some(o => kmBetween(o.lat, o.lon, x.lat, x.lon) < 0.05)) out.push(x);
  const first = [], last = [];
  for (const l of local) {
    if (out.some(o => kmBetween(o.lat, o.lon, l.lat, l.lon) < 0.4)) continue;
    (l.exact && l.r < 2 ? first : last).push(l);
  }
  return [...first, ...out, ...last].slice(0, 10);
}
async function geocode(q) {
  const c = me ? {lat:me.lat, lon:me.lon} : {lat:map.getCenter().lat, lon:map.getCenter().lng};
  const loc = localSearch(q);
  if (YKEY) { try { const r = await geocodeYandex(q, c); if (r.length) return mergeResults(r, loc).filter(x => inIst(x.lat, x.lon)); } catch (e) { console.warn('Yandex araması olmadı, ücretsiz kaynaklar deneniyor', e); } }
  // Photon (hatalı yazımı ve eksik kelimeyi tolere eder) + Nominatim (düzenli adres) birlikte
  const [ph, nm] = await Promise.allSettled([geocodePhoton(q, c), geocodeOsm(q, c)]);
  if (ph.status === 'rejected') console.warn('Photon araması olmadı', ph.reason);
  if (nm.status === 'rejected') console.warn('OSM araması olmadı', nm.reason);
  if (!loc.length && ph.status === 'rejected' && nm.status === 'rejected') throw new Error('arama servisleri yanıt vermedi');
  return mergeResults([...(ph.value || []), ...(nm.value || [])], loc).filter(x => inIst(x.lat, x.lon));
}
const reverse = async (lat, lon) => {
  try {
    const j = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=tr&lat=${lat}&lon=${lon}`).then(x => x.json());
    return j.display_name ? j.display_name.split(',').slice(0, 3).join(',').slice(0, 120) : '';
  } catch { return ''; }
};

// ---------- Mesafe, rota, Yandex ----------
const hav = (a, b, c, d) => { const R = 6371e3, r = Math.PI / 180, h = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
const fmtM = m => m < 1000 ? Math.max(10, Math.round(m / 10) * 10) + ' m' : (m / 1000).toFixed(1).replace('.', ',') + ' km';
let ride = null, route = null, routeLine = null, lastRouteAt = 0, lastRouteKey = '', fitKey = '', toastT;
const routeKeyOf = r => r.status + ':' + (r.status === 'picked_up' ? 'd' : 'p');
function toast(t) {
  let e = $('#toast'); if (!e) { e = document.createElement('div'); e.id = 'toast'; e.className = 'toast'; document.body.appendChild(e); }
  e.textContent = t; e.classList.remove('hide'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.add('hide'), 3500);
}
function liveHtml(r) {
  if (r.driverLat == null) return '<div class="live m" id="live">Şoförün konumu bekleniyor…</div>';
  const tgt = r.status === 'picked_up' ? r.dest : r.pickup;
  const straight = hav(r.driverLat, r.driverLon, tgt.lat, tgt.lon);
  const road = route && route.key === routeKeyOf(r) ? route : null;
  const label = r.status === 'picked_up' ? 'Varışa kalan' : 'Şoförle aranızdaki mesafe';
  return `<div class="live" id="live"><b>${label}: <span style="color:var(--cab)">${fmtM(road ? road.m : straight)}</span></b>${road ? ` · yaklaşık ${Math.max(1, Math.round(road.s / 60))} dk` : ' · <span class="m">(kuş uçuşu)</span>'}</div>`;
}
async function updateRoute(r) {
  if (!['accepted', 'picked_up'].includes(r.status) || r.driverLat == null) { routeLine?.remove(); routeLine = null; route = null; lastRouteKey = ''; return; }
  const key = routeKeyOf(r), tgt = r.status === 'picked_up' ? r.dest : r.pickup, now = Date.now();
  if (key === lastRouteKey && now - lastRouteAt < 15000) return;       // halka açık OSRM sunucusunu yormamak için en fazla 15 sn'de bir
  lastRouteKey = key; lastRouteAt = now;
  try {
    const j = await fetch(`https://router.project-osrm.org/route/v1/driving/${r.driverLon},${r.driverLat};${tgt.lon},${tgt.lat}?overview=full&geometries=geojson`).then(x => x.json());
    const rt = j.routes && j.routes[0]; if (!rt || !ride || routeKeyOf(ride) !== key) return;
    route = {key, m:rt.distance, s:rt.duration};
    routeLine?.remove();
    routeLine = L.polyline(rt.geometry.coordinates.map(c => [c[1], c[0]]), {color:'#ffc20e', weight:5, opacity:.85}).addTo(map);
    if (fitKey !== key) { fitKey = key; map.fitBounds(routeLine.getBounds(), {paddingTopLeft:[40, 70], paddingBottomRight:[40, 320], maxZoom:16}); }
    const el = $('#live'); if (el) el.outerHTML = liveHtml(ride);
  } catch {}
}
function openYandex(a, b) {                       // a: başlangıç, b: varış  {lat, lon}
  if (window.RotaPlayApp && window.RotaPlayApp.openYandexRoute) return window.RotaPlayApp.openYandexRoute(a.lat, a.lon, b.lat, b.lon);
  window.open(`https://yandex.com.tr/maps/?rtext=${a.lat},${a.lon}~${b.lat},${b.lon}&rtt=auto`, '_blank');
}

  try { if (window.RotaPlayApp && window.RotaPlayApp.copy) { window.RotaPlayApp.copy(t); return true; } await navigator.clipboard.writeText(t); return true; }

}

async function start(u) {

async function ensureProfile(u) {
  const s = await getDoc(doc(db, 'passengers', u.uid));
  if (s.exists()) return s.data();
  const p = JSON.parse(localStorage.getItem('pending:' + u.uid) || 'null');
  if (!p) return null;
  const d = {firstName:p.firstName, lastName:p.lastName, phone:p.phone, email:u.email, createdAt:Date.now()};
  await setDoc(doc(db, 'passengers', u.uid), d);
  localStorage.removeItem('pending:' + u.uid); log('kayit_oldu');

// ---------- Konum ----------
function gotPos(p) {
  me = {lat:p.coords.latitude, lon:p.coords.longitude, text:'Konumum'};
  meM?.remove(); meM = L.marker([me.lat, me.lon], {icon:icon('#46c37b')}).addTo(map); if (!rideId) map.setView([me.lat, me.lon], 15);
  const s = $('#locSt'); if (s) { s.textContent = '📍 Konumun alındı'; s.className = 'ok'; }
  const la = me.lat, lo = me.lon;                       // şoför "Konumum" yerine gerçek adresi görsün
  reverse(la, lo).then(t => { if (t && me && me.lat === la && me.lon === lo && me.text === 'Konumum') me.text = t; });
}
window.__nativePos = (la, lo, acc) => gotPos({coords:{latitude:la, longitude:lo, accuracy:acc}});   // Android uygulamasından gelen konum
window.__nativePosErr = code => locFail(code);
function locate() {
  const s = $('#locSt'); if (s) { s.textContent = 'Konum alınıyor…'; s.className = 'm'; }
  if (window.RotaPlayApp && window.RotaPlayApp.getLocation) return window.RotaPlayApp.getLocation();      // uygulama içinde: doğrudan telefonun konum servisi
  if (!navigator.geolocation) return locFail();
  navigator.geolocation.getCurrentPosition(gotPos, () =>               // tarayıcıda: önce hızlı (ağ tabanlı) konum, olmazsa GPS
    navigator.geolocation.getCurrentPosition(gotPos, locFail, {enableHighAccuracy:true, timeout:20000, maximumAge:0}),
    {enableHighAccuracy:false, timeout:8000, maximumAge:120000});
}
function locFail(e) {
  const s = $('#locSt'); if (!s) return;
  const code = typeof e === 'string' ? e : (e && e.code === 1 ? 'denied' : '');
  const app = window.RotaPlayApp;
  s.className = 'err';
  if (code === 'off') {
    s.innerHTML = 'Telefonun konumu (GPS) kapalı. Açıp tekrar dene. ' + (app && app.openLocationSettings ? '<button class="ghost" id="locSet">Konum ayarlarını aç</button>' : '');
    $('#locSet') && ($('#locSet').onclick = () => app.openLocationSettings());
  } else if (code === 'denied') {
    s.innerHTML = 'Konum izni verilmemiş. Ayarlardan konum iznini aç, sonra "Konumumu yenile"ye bas. ' + (app && app.openAppSettings ? '<button class="ghost" id="locSet">Uygulama ayarlarını aç</button>' : '');
    $('#locSet') && ($('#locSet').onclick = () => app.openAppSettings());
  } else if (code === 'timeout') {
    s.textContent = 'Konum zamanında alınamadı. Açık alanda tekrar dene ya da alış noktasını haritadan seç.';
  } else {
    s.textContent = 'Konum alınamadı. Telefonun konumunu açıp izin ver, ya da alış noktasını haritadan seç.';
  }
}

function setDest(lat, lon, text) {

  destM = L.marker([lat, lon], {icon:icon('#ffc20e'), draggable:!rideId}).addTo(map);
  destM.on('dragend', () => {                                  // pini sürükleyerek tam kapı yerini düzelt
    const p = destM.getLatLng(), la = p.lat, lo = p.lng; dest = {lat:la, lon:lo, text:'Haritada seçilen nokta'};
    const t = $('#destTxt'); if (t) t.textContent = '🏁 Haritada seçilen nokta';
    reverse(la, lo).then(tx => { if (tx && dest && dest.lat === la && dest.lon === lo) { dest.text = tx; const d = $('#destTxt'); if (d) d.textContent = '🏁 ' + tx; } });
  });
  const t = $('#destTxt'); if (t) t.textContent = '🏁 ' + (text || 'Haritada seçilen nokta');
}

function renderResults(r) {

  box.innerHTML = r.map((x, i) => `<div data-i="${i}"><b>${esc(x.title)}</b>${x.sub && x.sub !== x.title ? `<div class="m">${esc(x.sub)}</div>` : ''}</div>`).join('') || '<div>Sonuç yok. Mahalle ve ilçeyi de yazmayı deneyin. Olmazsa haritada varış noktasına dokunun ya da Yandex Harita\'dan kopyaladığınız koordinatı/bağlantıyı buraya yapıştırın.</div>';
  box.onclick = e => {
    const el = e.target.closest('[data-i]'); if (!el) return; const x = r[+el.dataset.i];
    setDest(x.lat, x.lon, String(x.full || x.title).slice(0, 135) + (x.approx ? ' (yaklaşık)' : '')); if (x.approx) dest.approx = true;
    map.setView([x.lat, x.lon], x.zoom || 16); box.innerHTML = ''; box.onclick = null;

async function search() {
  clearTimeout(sugT);
  const q = $('#q').value.trim(); if (!q) return;
  const box = $('#results'); box.innerHTML = '<div>Aranıyor…</div>'; box.onclick = null;
  const pc = parseCoords(q);
  if (pc) {                                                      // Yandex/Google bağlantısı ya da koordinat yapıştırıldı
    setDest(pc.lat, pc.lon, 'Yapıştırılan konum'); map.setView([pc.lat, pc.lon], 17); box.innerHTML = ''; toast('Konum işaretlendi. Gerekirse pini sürükleyin.');
    reverse(pc.lat, pc.lon).then(t => { if (t && dest && dest.lat === pc.lat && dest.lon === pc.lon) { dest.text = t; const d = $('#destTxt'); if (d) d.textContent = '🏁 ' + t; } });
    return;
  }
  try { renderResults(await geocode(q)); } catch { box.innerHTML = ''; setErr('Arama yapılamadı, haritada dokunarak seçin.'); }

// Yazarken öneri: Photon'un halka açık sunucusunu yormamamak için 3+ harf ve yazmayı bıraktıktan 0,7 sn sonra
let sugT;
function suggest() {
  clearTimeout(sugT);
  const inp = $('#q'); if (!inp) return; const q = inp.value.trim();
  if (q.length < 2 || parseCoords(q)) return;
  const loc = localSearch(q);
  if (loc.length) renderResults(loc);                         // yerel liste: anında, ağ gerekmez
  if (q.length < 3) return;
  sugT = setTimeout(async () => {
    try {
      const c = me ? {lat:me.lat, lon:me.lon} : {lat:map.getCenter().lat, lon:map.getCenter().lng};
      const r = mergeResults(await geocodePhoton(q, c), loc);
      if (r.length && $('#q') && $('#q').value.trim() === q) renderResults(r);
    } catch {}
  }, 700);
}

  if (pickMode) { pickMode = false; me = {lat:e.latlng.lat, lon:e.latlng.lng, text:'Haritada seçilen alış noktası'}; meM?.remove(); meM = L.marker([me.lat, me.lon], {icon:icon('#46c37b')}).addTo(map); const s = $('#locSt'); if (s) { s.textContent = '📍 Alış noktası seçildi'; s.className = 'ok'; } setErr(''); }
  else {
    const la = e.latlng.lat, lo = e.latlng.lng; setDest(la, lo, 'Haritada seçilen nokta');
    reverse(la, lo).then(t => { if (t && dest && dest.lat === la && dest.lon === lo) { dest.text = t; const d = $('#destTxt'); if (d) d.textContent = '🏁 ' + t; } });
  }
});
async function request() {

  if (dest.approx && !confirm('Varış noktası bölgenin yaklaşık merkezi, tam adresi işaretlemediniz. Yine de taksi çağırılsın mı?')) return;

}

// ---------- Yolculuk takibi ----------
function listen() { unsub?.(); unsub = onSnapshot(doc(db, 'rides', rideId), s => s.exists() ? render(s.data()) : reset(), () => reset()); }
const rideRef = () => doc(db, 'rides', rideId);
function render(r) {
  clearTimeout(expT); ride = r;
  if (!['accepted', 'picked_up'].includes(r.status) && panelOpen) closePanel();
  if (r.driverLat != null) { const ll = [r.driverLat, r.driverLon]; drvM ? drvM.setLatLng(ll) : drvM = L.marker(ll, {icon:icon('#ffc20e')}).addTo(map); } else if (drvM) { drvM.remove(); drvM = null; }
  const who = r.driverUid ? `<p><span class="plate">${esc(r.driverPlate)}</span> &nbsp;${esc(r.driverName)}</p>` : '';
  if (r.status === 'searching') {
    sheet.innerHTML = `<h1>${r.driverCancelled ? 'Şoför iptal etti' : 'Yakındaki taksiler aranıyor…'}</h1><p>${r.driverCancelled ? 'Sizin için yeni bir taksi aranıyor.' : 'Konumunuza yakın çevrimiçi taksilere bildirim gidiyor. Kabul eden şoför burada görünecek.'}</p><button class="ghost" id="cx">Vazgeç</button>`;
    expT = setTimeout(() => updateDoc(rideRef(), {status:'expired'}).catch(() => {}), Math.max(0, r.createdAt + 90000 - Date.now()));
  } else if (r.status === 'accepted') { sheet.innerHTML = `<h1>Taksiniz yolda</h1>${who}${liveHtml(r)}${actsHtml(r)}<button class="ghost" id="cx">İptal et</button>`; bindActs(r); }
  else if (r.status === 'picked_up') { sheet.innerHTML = `<h1>İyi yolculuklar</h1>${who}<p>Varış: ${esc(r.dest.text)}</p>${liveHtml(r)}${actsHtml(r)}`; bindActs(r); }
  else if (r.status === 'completed') {
    sheet.innerHTML = `<h1>Yolculuk bitti</h1><p>Taksimetre tutarı</p><div class="big">${money(r.fare)}</div>${who}
      ${r.driverRating ? '<p>Puanınız için teşekkürler.</p><button id="nw">Yeni yolculuk</button>' : `<p>Şoförü puanlayın</p><div class="stars">${[1,2,3,4,5].map(n => `<button data-n="${n}">★</button>`).join('')}</div><p class="err" id="err"></p><button id="sv">Puanı gönder</button><button class="link" id="sk">Şimdi değil</button>`}`;
    $('.stars')?.addEventListener('click', e => { const n = +e.target.dataset.n; if (!n) return; stars = n; document.querySelectorAll('.stars button').forEach((b, i) => b.classList.toggle('on', i < n)); });
    $('#sv') && ($('#sv').onclick = () => { if (!stars) return setErr('Önce yıldız seçin.'); rateDriver(r, stars); });
    $('#sk') && ($('#sk').onclick = reset);
  } else sheet.innerHTML = `<h1>${r.status === 'expired' ? 'Şu an müsait taksi bulunamadı' : 'Yolculuk iptal edildi'}</h1><button id="nw">Tekrar dene</button>`;
  $('#cx') && ($('#cx').onclick = () => updateDoc(rideRef(), {status:'cancelled'}).then(() => log('yolcu_iptal', rideId)).catch(() => {}));
  $('#nw') && ($('#nw').onclick = reset);
  if (panelOpen) loadDriverProfile(r);
  updateRoute(r);
}
// Puan hem yolculuğa hem şoförün genel puanına tek işlemde yazılır
async function rateDriver(r, n) {
  try {
    await runTransaction(db, async tx => {
      const sref = doc(db, 'driverStats', r.driverUid), s = await tx.get(sref);
      const sum = (s.exists() ? s.data().sum : 0) + n, count = (s.exists() ? s.data().count : 0) + 1;
      tx.set(sref, {sum, count, avg:sum / count, lastRide:rideId, name:r.driverName});
      tx.update(rideRef(), {driverRating:n});
    });
    log('soforu_puanladi', n + ' yıldız');
  } catch (e) { setErr('Puan gönderilemedi (' + (e.code || e.message) + ')'); }
}
function reset() { unsub?.(); clearTimeout(expT); closePanel(); ride = null; updateRoute({status:'x'}); fitKey = ''; if (user) localStorage.removeItem('rideId:' + user.uid); rideId = null; dest = null; stars = 0; destM?.remove(); drvM?.remove(); drvM = null; page.classList.add('hide'); viewForm(); }

// ---------- Profil ----------
profBtn.onclick = viewProfile;
const statsOf = async (coll, id) => { const s = await getDoc(doc(db, coll, id)); return s.exists() ? s.data() : null; };
const rankOf = async (coll, avg) => {
  const [a, t] = await Promise.all([getCountFromServer(query(collection(db, coll), where('avg', '>', avg))), getCountFromServer(collection(db, coll))]);
  return {rank:a.data().count + 1, total:t.data().count};
};
const stat = (s, rk, unit) => s ? `★ ${s.avg.toFixed(1)} (${s.count} puan)${rk ? ` · ${rk.rank}. sırada / ${rk.total} ${unit}` : ''}` : 'Henüz puanlanmadı';
const sl = {searching:['Aranıyor', ''], accepted:['Yolda', ''], picked_up:['Yolculukta', ''], completed:['Tamamlandı', 'g'], cancelled:['İptal', 'r'], expired:['Süresi doldu', 'r']};
async function viewProfile() {
  page.classList.remove('hide');
  page.innerHTML = `<div class="in"><button class="ghost" id="back" style="margin:0 0 12px">← Haritaya dön</button><h1>Profilim</h1><p>Yükleniyor…</p></div>`;
  $('#back').onclick = () => page.classList.add('hide');
  try {
    const [mine, rides] = await Promise.all([statsOf('passengerStats', user.uid), getDocs(query(collection(db, 'rides'), where('passengerUid', '==', user.uid), limit(100)))]);
    const myRank = mine ? await rankOf('passengerStats', mine.avg) : null;
    const list = rides.docs.map(d => ({id:d.id, ...d.data()})).sort((a, b) => b.createdAt - a.createdAt);
    const ids = [...new Set(list.map(r => r.driverUid).filter(Boolean))].slice(0, 12), info = {};
    await Promise.all(ids.map(async id => { const s = await statsOf('driverStats', id); info[id] = {s, rk:s ? await rankOf('driverStats', s.avg) : null}; }));
    page.innerHTML = `<div class="in"><button class="ghost" id="back" style="margin:0 0 12px">← Haritaya dön</button><h1>Profilim</h1>
      <div class="card"><div class="kv"><span>Ad Soyad</span><span>${esc(profile.firstName)} ${esc(profile.lastName)}</span></div><div class="kv"><span>Telefon</span><span>${esc(profile.phone)}</span></div>
      <div class="kv"><span>E-posta</span><span>${esc(profile.email)}</span></div></div>
      <h2>Yolcu puanım</h2><div class="card">${stat(mine, myRank, 'yolcu')}</div>
      <h2>Seferlerim</h2>${list.map(r => { const d = info[r.driverUid], [t, c] = sl[r.status] || [r.status, '']; return `<div class="card"><span class="tag ${c}">${t}</span> <span class="m">${tl(r.createdAt)}</span>
        <p style="color:var(--text);margin-top:8px">${esc(r.pickup.text)} → ${esc(r.dest.text)}</p>
        ${r.driverUid ? `<p>Şoför: <b style="color:var(--text)">${esc(r.driverName)}</b> · <span class="plate">${esc(r.driverPlate)}</span></p><p>${d ? stat(d.s, d.rk, 'şoför') : ''}</p>` : ''}
        ${r.fare != null ? `<p>Taksimetre: <b style="color:var(--cab)">${money(r.fare)}</b></p>` : ''}${r.driverRating ? `<p>Verdiğin puan: ★ ${r.driverRating}</p>` : ''}${r.passengerRating ? `<p>Şoförün sana verdiği puan: ★ ${r.passengerRating}</p>` : ''}</div>`; }).join('') || '<p>Henüz seferin yok.</p>'}
      <button class="ghost" id="out" style="margin-top:20px">Çıkış yap</button></div>`;
    $('#back').onclick = () => page.classList.add('hide'); $('#out').onclick = () => signOut(auth);
  } catch (e) { page.innerHTML = `<div class="in"><button class="ghost" id="back">← Geri</button><h1>Profil yüklenemedi</h1><p>${esc(e.code || e.message)}</p></div>`; $('#back').onclick = () => page.classList.add('hide'); }
}

// ---------- Test modu: adrese ?test=1 eklenince çalışır. GPX izini sahte şoför olarak oynatır; Firestore'a hiçbir şey yazmaz ----------
if (new URLSearchParams(location.search).get('test') === '1') {
  const sc = document.createElement('script');
  sc.src = 'test-rota.js';
  sc.onload = () => {
    const T = window.TEST_ROUTE || [];
    if (T.length < 2) return;
    const cum = [0]; for (let i = 1; i < T.length; i++) cum.push(cum[i - 1] + hav(T[i - 1][0], T[i - 1][1], T[i][0], T[i][1]));
    const total = cum[cum.length - 1];
    L.polyline(T, {color:'#7c3aed', weight:4, opacity:.7, dashArray:'6 8'}).addTo(map);
    map.fitBounds(L.latLngBounds(T), {padding:[40, 40]});
    const mk = L.marker(T[0], {icon:icon('#ffc20e'), zIndexOffset:1000}).addTo(map);
    let d = 0, k = 0, playing = true, speed = 5, last = 0;          // speed: 1 = yaklaşık 40 km/sa
    const panel = document.createElement('div');
    panel.style.cssText = 'position:fixed;top:70px;left:10px;z-index:2000;background:#000c;color:#fff;font:13px system-ui;padding:8px 10px;border-radius:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:92vw';
    panel.innerHTML = '<b>TEST</b><button id="tPlay">⏸</button><button id="tRe">↺</button><select id="tSp"><option>1</option><option selected>5</option><option>20</option><option>60</option></select>×<span id="tInfo"></span>';
    document.body.appendChild(panel);
    panel.querySelectorAll('button,select').forEach(e => e.style.cssText = 'font:13px system-ui;padding:3px 8px');
    const at = m => { while (k < cum.length - 2 && cum[k + 1] < m) k++; while (k > 0 && cum[k] > m) k--; const t = (m - cum[k]) / ((cum[k + 1] - cum[k]) || 1); return [T[k][0] + (T[k + 1][0] - T[k][0]) * t, T[k][1] + (T[k + 1][1] - T[k][1]) * t]; };
    const show = () => { panel.querySelector('#tInfo').textContent = fmtM(d) + ' / ' + fmtM(total) + (d >= total ? ' · bitti' : ''); };
    const tick = ts => {
      if (playing && d < total) { if (last) d = Math.min(total, d + (ts - last) / 1000 * 11 * speed); mk.setLatLng(at(d)); show(); }
      last = ts; requestAnimationFrame(tick);
    };
    panel.querySelector('#tPlay').onclick = e => { playing = !playing; e.target.textContent = playing ? '⏸' : '▶'; };
    panel.querySelector('#tRe').onclick = () => { d = 0; k = 0; playing = true; panel.querySelector('#tPlay').textContent = '⏸'; };
    panel.querySelector('#tSp').onchange = e => { speed = +e.target.value; };
    requestAnimationFrame(tick);
  };
  document.body.appendChild(sc);
}

</script></body></html>
